# /etc/s3disk/project.conf — one mount, started by `systemctl start s3disk@project`.

# The bucket (and optional prefix) to mount, and where to mount it.
S3DISK_BUCKET=s3://my-bucket/project
S3DISK_MOUNTPOINT=/srv/project

# Extra flags, exactly as they would be typed on the command line.
S3DISK_MOUNT_ARGS=--allow-other --cache-size 16G --uid 1000 --gid 1000

# Credentials. Prefer an instance role or a shared profile over static keys.
# AWS_PROFILE=production
AWS_REGION=us-east-1
# AWS_ACCESS_KEY_ID=...
# AWS_SECRET_ACCESS_KEY=...

# For a non-AWS provider (MinIO, Ceph, R2, Wasabi):
# S3DISK_MOUNT_ARGS=--endpoint https://s3.example.com --path-style
